<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Оплата — Микрозелень · Агронайзер</title>
  <meta name="description" content="Оплата доступа к приложению Микрозелень." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://yookassa.ru/integration/simplepay/css/yookassa_construct_form.css?v=1.34.0" />
  <style>
    :root {
      --forest: #1b4332;
      --mist: #d8f3dc;
      --canvas: #f3faf5;
      --ink: #1a2e24;
      --muted: #5c7268;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(165deg, var(--mist) 0%, var(--canvas) 45%, #e8f6ec 100%);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(440px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 3rem;
    }

    .back {
      display: inline-block;
      color: var(--forest);
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      margin-bottom: 1.25rem;
    }

    .back:hover { text-decoration: underline; }

    h1 {
      font-family: "Fraunces", serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 5vw, 2rem);
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
      color: var(--forest);
    }

    .lead {
      margin: 0 0 1.5rem;
      color: var(--muted);
    }

    .card {
      background: #fff;
      border-radius: 1.1rem;
      padding: 1.25rem 1.1rem 1.4rem;
      box-shadow: 0 18px 40px rgba(27, 67, 50, 0.1);
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="/">← На главную</a>
    <h1>Микрозелень</h1>
    <p class="lead">Оплата доступа к приложению, 300 ₽.</p>
    <div class="card">
      <form class="yoomoney-payment-form" action="https://yookassa.ru/integration/simplepay/payment" method="post" accept-charset="utf-8">
        <div class="ym-customer-info">
          <div class="ym-block-title">О покупателе</div>
          <input name="cps_email" class="ym-input" placeholder="Email" type="text" value="">
        </div>
        <div class="ym-hidden-inputs">
          <input name="shopSuccessURL" type="hidden" value="https://agronizer.ru/">
          <input name="shopFailURL" type="hidden" value="https://agronizer.ru/">
        </div>
        <input name="customerNumber" type="hidden" value="Оплата доступа к приложению">
        <div class="ym-payment-btn-block ym-before-line ym-align-space-between">
          <div class="ym-input-icon-rub ym-display-none">
            <input name="sum" placeholder="0.00" class="ym-input ym-sum-input ym-required-input" type="number" step="any" value="300">
          </div>
          <button data-text="Заплатить" class="ym-btn-pay ym-result-price" type="submit">
            <span class="ym-text-crop">Заплатить</span>
            <span class="ym-price-output"> 300,00&nbsp;₽</span>
          </button>
          <img src="https://yookassa.ru/integration/simplepay/img/iokassa-gray.svg?v=1.34.0" class="ym-logo" width="114" height="27" alt="ЮKassa">
        </div>
        <input name="shopId" type="hidden" value="1283724">
      </form>
    </div>
  </main>
  <script src="https://yookassa.ru/integration/simplepay/js/yookassa_construct_form.js?v=1.34.0"></script>
</body>
</html>
