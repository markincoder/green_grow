server {
    listen 80;
    server_name agronizer.ru www.agronizer.ru;
    root /usr/share/nginx/html;
    index index.html;

    # Крупный APK (~20MB) без лишних буферов
    client_max_body_size 50m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /green_grow.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="agronizer.apk"';
        add_header Cache-Control "public, max-age=3600";
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Не отдавать скрытые файлы
    location ~ /\. {
        deny all;
    }
}
