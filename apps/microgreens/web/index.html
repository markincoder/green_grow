<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Микрозелень дома — база знаний, циклы выращивания и напоминания.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://agronizer.ru/">

  <meta name="theme-color" content="#2D6A4F">
  <!-- Android: installable PWA (standalone) so Home Screen icon actually launches.
       Notifications are configured on /gate/ in a normal Chrome tab. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Микрозелень">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Микрозелень</title>
  <link rel="manifest" href="manifest.json" type="application/manifest+json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #F3FAF5;
    }
    #agronizer-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F3FAF5;
      z-index: 9999;
    }
    #agronizer-splash img {
      width: 96px;
      height: 96px;
    }
  </style>
  <script src="push_client.js?v=sub27" defer></script>
  <!-- Icon install on this page (SW scope). Chrome uses beforeinstallprompt. -->
  <script src="setup_gate.js?v=gate66" defer></script>
  <script src="pwa_update.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
  <div id="agronizer-splash">
    <img src="icons/Icon-192.png" alt="">
  </div>
  <script>
    (function () {
      function hide() {
        var el = document.getElementById('agronizer-splash');
        if (el) el.remove();
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 20000);
    })();
  </script>
</body>
</html>
